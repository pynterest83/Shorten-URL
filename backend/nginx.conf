http {
    upstream read_server {
        server 127.0.0.1:8080; # Server chỉ đọc
        server 127.0.0.1:8081; # Server chỉ đọc
        server 127.0.0.1:8082; # Server chỉ đọc
        server 127.0.0.1:8083; # Server chỉ đọc
    }

    upstream write_server {
        server 127.0.0.1:8083; # Server chỉ ghi
    }

    server {
        listen 80;

        # Route các yêu cầu GET đến server đọc
        location / {
            if ($request_method = GET) {
                proxy_pass http://read_server;
                break;
            }

            # Route các yêu cầu POST/DELETE đến server ghi
            if ($request_method = POST) {
                proxy_pass http://write_server;
                break;
            }

            if ($request_method = DELETE) {
                proxy_pass http://write_server;
                break;
            }

            # Các phương thức khác trả lỗi 405
            return 405;
        }
    }
}